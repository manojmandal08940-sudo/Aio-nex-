<!-- Smart AI Button -->
<button onclick="openboard()" style="position:fixed;bottom:92px;right:18px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#facc15,#f97316);border:none;font-size:28px;cursor:pointer;z-index:999;box-shadow:0 10px 30px rgba(250,204,21,.5)">🧠</button>

<!-- Smart AI Popup -->
<div id="boardbox" style="position:fixed;inset:0;background:#050a1a;z-index:2000;display:none;flex-direction:column">
  <!-- Header: Yaha text ko bada aur bold kiya gaya hai -->
  <div style="background:linear-gradient(90deg,#00e5ff,#2563eb);color:#000;padding:16px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <b style="font-size:20px; font-weight:900;">🧠 AIONEX SMART AI</b><br>
      <small style="font-size:13px; font-weight:700; color:#050a1a;">Koi bhi sawal pucho - koi bhi problem do - hal milega!</small>
    </div>
    <span onclick="closeboard()" style="font-size:28px;cursor:pointer;font-weight:bold">✕</span>
  </div>

  <!-- Board Menu: Buttons ke font aur padding theek ki gayi hai -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px">
    <button onclick="boardask('mujhe business idea do')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">💡 Business Idea</button>
    <button onclick="boardask('maths solve karo - 25 x 48')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">🧮 Maths Solver</button>
    <button onclick="boardask('mujhe ek accha caption likh ke do')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">✍️ Caption / Post</button>
    <button onclick="boardask('english me translate karo - main jagatsinghpur se hu')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">🌐 Translate</button>
    <button onclick="boardask('website ke liye content likho')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">💻 Website Content</button>
    <button onclick="boardask('mujhe motivation do')" style="background:#0a1230;border:1px solid #00e5ff;color:#00e5ff;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:bold;cursor:pointer">🔥 Motivation</button>
  </div>

  <!-- Messages Area: Text size 15px aur line-height badhai gayi hai taaki padhne me asani ho -->
  <div id="boardmsgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px"></div>

  <!-- Input Area: Typing text box ka size bada kiya gaya hai -->
  <div style="display:flex;gap:8px;padding:12px;background:#0a1230;border-top:1px solid #1e3a5f">
    <input id="boardinput" placeholder="Koi bhi problem likho... maths, business, english, code - sab!" style="flex:1;padding:14px;border-radius:12px;border:1px solid #1e3a5f;background:#050a1a;color:#fff;font-size:15px;outline:none;margin:0">
    <button onclick="sendboard()" style="background:#00e5ff;color:#000;border:none;padding:0 20px;border-radius:12px;font-weight:900;font-size:20px;cursor:pointer">➤</button>
  </div>
</div>

<script>
let boardopened = false;
let boardlastq = "";

function openboard() {
  const box = document.getElementById('boardbox');
  box.style.display = 'flex';
  if (!boardopened) {
    boardopened = true;
    boardadd('bot', "Namaste Bablu! 🙏 Main Aionex Smart AI Board hu!\n\nMain kya-kya kar sakta hu:\n\n🧮 Maths - koi bhi hisab\n💡 Business Idea - naya dhandha\n✍️ Caption / Post - Instagram ke liye\n🌐 Translate - Hindi to English\n💻 Website / Code - sab likh dunga\n🔥 Motivation - jab man down ho\n❤️ Health Tip - sehat ke liye\n📚 Padhai - koi bhi subject\n\nBolo, aaj kya problem hai? Likho yaha 👇");
  }
}

function closeboard() {
  document.getElementById('boardbox').style.display = 'none';
}

function boardadd(who, text) {
  let d = document.createElement('div');
  // Yaha text ka size (15px) aur color bilkul clear rakha hai
  d.style.cssText = `padding:14px 16px;border-radius:16px;font-size:15px;line-height:1.7;max-width:92%;white-space:pre-line;${who === 'bot' ? 'background:#1e293b;color:#f1f5f9;align-self:flex-start' : 'background:#00e5ff;color:#000;align-self:flex-end;font-weight:700'}`;
  d.innerText = text;
  const msgs = document.getElementById('boardmsgs');
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function boardask(t) {
  document.getElementById('boardinput').value = t;
  sendboard();
}

function sendboard() {
  let inp = document.getElementById('boardinput');
  let q = inp.value.trim();
  if (!q) return;
  boardadd('user', q);
  inp.value = '';
  boardadd('bot', "⏳ Soch raha hu...");
  
  setTimeout(() => {
    let msgs = document.getElementById('boardmsgs');
    if (msgs.lastChild) {
      msgs.removeChild(msgs.lastChild);
    }
    let ans = smartbrain(q);
    boardadd('bot', ans);
    
    if (typeof chats !== 'undefined' && typeof save === 'function') {
      chats.push({ q, a: ans, time: new Date().toLocaleString('en-IN') });
      save();
    }
  }, 700);
}

function smartbrain(qorig) {
  let q = qorig.toLowerCase();
  if (q === boardlastq) return "Are ye to tumne abhi pucha tha! 😅 Chalo naya sawal pucho - maths, business, caption, kuch bhi! Main sab kar dunga.";
  boardlastq = q;

  // 1. Maths Solver
  try {
    let mathq = q.replace(/x/g, '*').replace(/×/g, '*').replace(/,/g, '');
    let m = mathq.match(/(\d+)\s*([\+\-\*\/\%])\s*(\d+)/);
    if (m && (q.includes('+') || q.includes('-') || q.includes('*') || q.includes('/') || q.includes('x') || q.includes('guna') || q.includes('jod') || q.includes('solve') || q.includes('hisab') || q.includes('maths') || q.includes('ganit'))) {
      let a = parseFloat(m[1]), b = parseFloat(m[3]), op = m[2], res = 0, opname = "";
      if (op === '+') { res = a + b; opname = "Jod"; }
      if (op === '-') { res = a - b; opname = "Ghata"; }
      if (op === '*') { res = a * b; opname = "Guna"; }
      if (op === '/') { res = (a / b).toFixed(2); opname = "Bhag"; }
      if (op === '%') { res = a % b; opname = "Bacha hua"; }
      return `🧮 Maths hal ho gaya!\n\n${a} ${op} ${b} = ${res}\n\nSamjho aise:\n${opname} karne pe ${a} aur ${b} se ${res} aaya.\n\nAur koi hisab hai to bhejo!`;
    }
  } catch (e) {}

  // 2. Business Idea
  if (q.includes('business') || q.includes('dhandha') || q.includes('idea') || q.includes('paisa') || q.includes('kamai')) {
    return "💡 Business Idea - Digital Seva:\nJagatsinghpur me logon ko website, digital card, poster chahiye. Tum Aionex se ye shuru karo. Lagat - 0, Kamai - ₹1499 per website!\n\nEk mahine me 10 website = ₹14,990! Karna hai to bolo - main plan bana du?";
  }

  // 3. Caption / Post
  if (q.includes('caption') || q.includes('post') || q.includes('shayari') || q.includes('status')) {
    return `✍️ Tumhare liye ready caption:\n\n"Mehnat itni khamoshi se karo ki safalta shor macha de! 🔥"\n\nAur Instagram Bio ke liye:\n"Jagatsinghpur | AI Creator | Website ₹1499 | DM karo 📩"`;
  }

  // 4. Translate
  if (q.includes('translate') || q.includes('english')) {
    return "🌐 Translate:\n\nHindi: Main Jagatsinghpur se hu\nEnglish: I am from Jagatsinghpur, Odisha.\n\nAur koi line bhejo, main translate kar dunga!";
  }

  // 5. Website / Content
  if (q.includes('website') || q.includes('code') || q.includes('content')) {
    return "💻 Website ke liye content ready hai!\n\nHeading: Aionex - Future ka AI OS\nPrice: Sirf ₹1499 me tumhari website ban jayegi!\n\nOrder karne ke liye - Call karo 93370 43811";
  }

  // 6. Motivation
  if (q.includes('motivation') || q.includes('sad') || q.includes('problem') || q.includes('tension')) {
    return "🔥 Suno Bablu bhai!\nProblem sabko aati hai, par rukne wala kabhi jeet-ta nahi!\nTumne Aionex banaya hai - ye koi chhota kaam nahi hai! Jagatsinghpur se pure India tak jaane wala hai ye!";
  }

  // Default Fallback
  return `Samajh gaya! Tumne pucha - "${qorig}"\n\nIska sabse best hal ye hai ki aap ise step-by-step karein ya Bablu se baat karein - 93370 43811 par.`;
}

document.getElementById('boardinput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendboard();
});
</script>
